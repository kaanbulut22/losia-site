<!doctype html>
<!--
  Social cover source (X 1500x500, Facebook 1640x624). Render with a headless browser:
    msedge --headless=new --window-size=1500,500 --screenshot=x.png "http://127.0.0.1:8765/_tools/cover.html?v=a&w=1500&h=500"
  v: a (paper), b (rose), c (night), d (paper layout on the rose). guide=1 draws the profile photo and the mobile crop.
-->
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    html, body { margin: 0; overflow: hidden; }
    /* No paper grain: over the phone screens it reads as noise. */
    body::before { display: none; }
    .cover { position: relative; overflow: hidden; }
    .spark { position: absolute; }
    .phone { position: absolute; padding: calc(var(--u) * 1.4); border-radius: calc(var(--u) * 7); }
    .phone img { border-radius: calc(var(--u) * 5.8); }

    /* A: paper */
    .a { background: var(--paper); }
    .a h1 {
      position: absolute; margin: 0; left: 27%; top: 17%;
      font-family: var(--serif); font-weight: 340; font-size: calc(var(--u) * 19);
      line-height: 0.95; letter-spacing: -0.035em; font-variation-settings: "opsz" 144;
    }
    .a h1 em { font-style: italic; font-weight: 300; color: var(--rose); }
    .a .en { position: absolute; left: 27.3%; top: 62%; font-family: var(--serif); font-style: italic; color: var(--ink-soft); font-size: calc(var(--u) * 5.4); }
    .a .foot { position: absolute; left: 27.3%; top: 80%; color: var(--ink-soft); font-size: calc(var(--u) * 2.6); }
    .a .phone { width: calc(var(--u) * 52); right: 7%; top: 14%; transform: rotate(5deg); }

    /* B: rose */
    .b { background: var(--rose); color: #fff; text-align: center; }
    .b .center { position: absolute; left: 50%; top: 50%; transform: translate(-42%, -54%); }
    .b h1 { margin: 0; font-family: var(--serif); font-weight: 340; font-size: calc(var(--u) * 30); line-height: 1; letter-spacing: -0.03em; font-variation-settings: "opsz" 144; }
    .b p { margin: calc(var(--u) * 3) 0 0; font-size: calc(var(--u) * 4.6); line-height: 1.35; color: #ffe4ec; }
    .b .spark { fill: #fff; }

    /* C: night */
    .c { background: var(--night); color: var(--night-ink); }
    .c .word { position: absolute; left: 6%; top: 12%; font-family: var(--serif); font-size: calc(var(--u) * 11); font-weight: 340; letter-spacing: -0.03em; }
    .c .word svg { width: calc(var(--u) * 4.4); height: calc(var(--u) * 4.4); fill: var(--glow); vertical-align: top; margin-left: calc(var(--u) * 1); }
    .c .lines { position: absolute; left: 6%; top: 40%; font-family: var(--serif); font-style: italic; font-weight: 300; font-size: calc(var(--u) * 5.6); line-height: 1.2; color: var(--night-soft); }
    .c .lines b { font-weight: 300; color: var(--night-ink); }
    .c .phone { width: calc(var(--u) * 46); background: #0a0809; box-shadow: 0 0 0 1.5px #3a3236 inset, 0 30px 80px -20px rgba(242, 139, 170, 0.35); }
    .c .spark { fill: var(--glow); }

    /* D: the paper layout on the rose, white type. */
    .d { background: var(--rose); color: #fff; }
    .d h1 em { color: #ffd6e3; }
    .d .en { color: #ffe4ec; }
    .d .foot { color: rgba(255, 255, 255, 0.78); }
    .d .spark { fill: #fff; }
    .d .wordmark { position: absolute; left: 26.6%; top: 4%; font-size: calc(var(--u) * 24); gap: calc(var(--u) * 2.4); }
    .d .wordmark svg { width: calc(var(--u) * 8.5); height: calc(var(--u) * 8.5); fill: #ffd6e3; transform: translateY(calc(var(--u) * -5.5)); }
    .d h1 { top: 46%; font-size: calc(var(--u) * 8.6); white-space: nowrap; }
    .d .en { top: 62%; font-size: calc(var(--u) * 4.4); }
    .d .foot { top: 80%; }
    .fb.a.d .wordmark { left: 18.6%; top: 6%; font-size: calc(var(--u) * 20); }
    .fb.a.d h1 { top: 43%; font-size: calc(var(--u) * 7.2); }
    .fb.a.d .en { top: 56%; font-size: calc(var(--u) * 3.8); }
    .fb.a.d .foot { top: 69%; }
    .d .phone { box-shadow: 0 0 0 1.5px #4d4448 inset, 0 40px 60px -24px rgba(60, 10, 30, 0.55); }

    /* E: D with three phones (light Today, dark Today in front, Shelf); the text moves left to make room. */
    .a.d.e .wordmark { left: 20%; }
    .a.d.e h1, .a.d.e .en, .a.d.e .foot { left: 20.4%; }
    .a.d.e .foot { top: 76%; line-height: 1.7; }
    .a.d.e .phone { width: calc(var(--u) * 42); }
    .a.d.e .phone.dark { background: #0a0809; box-shadow: 0 0 0 1.5px #3a3236 inset, 0 40px 70px -20px rgba(40, 5, 20, 0.65); }
    /* The site puts white behind screenshots; on the dark one it shows as a broken line along the edges. */
    .a.d.e .phone.dark img { background: #0a0809; }
    /* The Facebook app shows only the middle ~55% (about 1.45:1) and puts the profile photo over the
       lower middle, so text sits upper left of that window and the phones to the right of the photo. */
    .fb.a.d.e .wordmark { left: 24%; top: 5%; font-size: calc(var(--u) * 15); }
    .fb.a.d.e h1, .fb.a.d.e .en { left: 24.3%; }
    .fb.a.d.e h1 { top: 34%; font-size: calc(var(--u) * 5.6); }
    .fb.a.d.e .en { top: 45%; font-size: calc(var(--u) * 3.1); }
    .fb.a.d.e .foot { display: none; }
    .fb.a.d.e .phone { width: calc(var(--u) * 25); }

    /* Facebook: phones show only the middle 640x360 share, so everything moves inward. */
    .fb.a h1 { left: 19%; top: 14%; font-size: calc(var(--u) * 15.5); }
    .fb.a .en { left: 19.3%; top: 52%; font-size: calc(var(--u) * 4.8); }
    .fb.a .foot { left: 19.3%; top: 66%; font-size: calc(var(--u) * 2.2); }
    .fb.a .phone { width: calc(var(--u) * 44); right: 18.5%; top: 12%; }
    .fb.c .word { left: 19%; top: 14%; font-size: calc(var(--u) * 9.5); }
    .fb.c .lines { left: 19%; top: 40%; font-size: calc(var(--u) * 4.4); }
    .fb.c .phone { width: calc(var(--u) * 37); }

    .guide { position: absolute; inset: 0; pointer-events: none; z-index: 200; }
    .guide .avatar { position: absolute; border-radius: 50%; background: rgba(0, 120, 255, 0.35); outline: 3px solid #0a6cff; }
    .guide .crop { position: absolute; top: 0; bottom: 0; outline: 3px dashed #0a6cff; }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute">
    <symbol id="spark" viewBox="0 0 100 100"><path d="M50 0C54 28 72 46 100 50 72 54 54 72 50 100 46 72 28 54 0 50 28 46 46 28 50 0Z"/></symbol>
  </svg>
  <div class="cover" id="cover"></div>
  <script>
    const q = new URLSearchParams(location.search);
    const W = +(q.get("w") || 1500), H = +(q.get("h") || 500), v = q.get("v") || "a";
    const cover = document.getElementById("cover");
    document.documentElement.style.cssText = `width:${W}px;height:${H}px`;
    cover.style.cssText = `width:${W}px;height:${H}px;--u:${H / 100}px`;
    const fb = W / H < 2.8;
    cover.className = "cover " + ({ d: "a d", e: "a d e" }[v] || v) + (fb ? " fb" : "");
    const spark = (x, y, s, o = 1) =>
      `<svg class="spark" style="left:${x}%;top:${y}%;width:${s * H / 100}px;height:${s * H / 100}px;opacity:${o}"><use href="#spark"/></svg>`;
    const phone = (src, css, cls = "") => `<div class="phone ${cls}" style="${css}"><img src="../assets/screens/${src}.webp" alt=""></div>`;

    if (v === "a" || v === "d" || v === "e") {
      const rose = v !== "a";
      const sparks = !rose ? "" : v === "e"
        ? (fb ? spark(10, 20, 6, 0.3) + spark(52, 10, 4, 0.3) + spark(86, 70, 6, 0.25) + spark(80, 6, 3, 0.3)
              : spark(4, 14, 6, 0.3) + spark(52, 8, 4, 0.3) + spark(97, 8, 4, 0.3))
        : fb
          ? spark(21, 80, 4, 0.25) + spark(57, 10, 5, 0.3) + spark(78, 78, 6, 0.22)
          : spark(4, 14, 6, 0.3) + spark(64, 10, 5, 0.3) + spark(66, 72, 7, 0.22) + spark(96, 8, 4, 0.3);
      const mark = rose ? `<span class="wordmark">Losia <svg><use href="#spark"/></svg></span>` : "";
      const foot = v === "e"
        ? "Cilt bakım rutini ve ürün dolabı<br>Skincare routine &amp; shelf"
        : "Cilt bakım rutini ve ürün dolabı · Skincare routine &amp; shelf";
      // Side phones first so the dark one in the middle sits on top.
      const phones = v !== "e" ? phone("tr-01", "") : fb
        ? phone("tr-01", "right:36%;top:26%;transform:rotate(-6deg)") +
          phone("tr-02", "right:23.5%;top:26%;transform:rotate(6deg)") +
          phone("tr-dark-01", "right:29.5%;top:9%", "dark")
        : phone("tr-01", "right:29%;top:30%;transform:rotate(-6deg)") +
          phone("tr-02", "right:2.5%;top:30%;transform:rotate(6deg)") +
          phone("tr-dark-01", "right:15.5%;top:12%", "dark");
      cover.innerHTML = `${sparks}${mark}<h1>Sabahın, <em>akşamın,</em>${rose ? " " : "<br>"}dolabın.</h1>
        <div class="en">Your mornings, evenings, your shelf.</div>
        <div class="foot eyebrow">${foot}</div>
        ${phones}`;
    } else if (v === "b") {
      cover.innerHTML = `${spark(14, 18, 9, 0.35)}${spark(84, 14, 6, 0.3)}${spark(90, 66, 11, 0.22)}${spark(24, 70, 5, 0.25)}
        <div class="center"><h1>Losia</h1>
        <p>Cilt bakım rutinin ve ürün dolabın tek yerde.<br>Your skincare routine &amp; shelf in one place.</p></div>
        ${spark(66.5, 18, 7)}`;
    } else {
      cover.innerHTML = `<div class="word">Losia<svg><use href="#spark"/></svg></div>
        <div class="lines"><b>Sabahın, akşamın, dolabın.</b><br>Your mornings, evenings, your shelf.</div>
        ${phone("tr-dark-01", fb ? "right:31%;top:32%;transform:rotate(-6deg)" : "right:37%;top:30%;transform:rotate(-6deg)")}
        ${phone("tr-01", fb ? "right:17.5%;top:16%" : "right:20%;top:14%")}
        ${fb ? "" : phone("tr-02", "right:3%;top:30%;transform:rotate(6deg)")}
        ${fb ? spark(50, 14, 4) + spark(80, 8, 3, 0.7) : spark(56, 12, 4) + spark(97, 10, 3, 0.7) + spark(62, 82, 2.6, 0.6)}`;
    }

    if (q.get("guide")) {
      const g = document.createElement("div");
      g.className = "guide";
      if (!fb) {
        // X: the profile photo sits over the lower left, about 9% from the edge.
        const s = H * 0.5;
        g.innerHTML = `<div class="avatar" style="left:${W * 0.015}px;top:${H - s * 0.5}px;width:${s}px;height:${s}px"></div>`;
      } else {
        // Facebook: the app shows the middle ~1.45:1 with the photo over the lower middle;
        // the desktop photo sits over the lower left.
        const cw = H * 1.45, s = H * 0.55, m = H * 0.61;
        g.innerHTML = `<div class="crop" style="left:${(W - cw) / 2}px;width:${cw}px"></div>
          <div class="avatar" style="left:${(W - m) / 2}px;top:${H * 0.625}px;width:${m}px;height:${m}px"></div>
          <div class="avatar" style="left:${W * 0.02}px;top:${H - s * 0.45}px;width:${s}px;height:${s}px"></div>`;
      }
      cover.appendChild(g);
    }
  </script>
</body>
</html>
